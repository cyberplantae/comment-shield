name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-arm64
            flags: --mac --arm64
          - os: macos-15-intel
            target: mac-x64
            flags: --mac --x64
          - os: windows-2022
            target: windows-x64
            flags: --win --x64
          - os: ubuntu-24.04
            target: linux-x64
            flags: --linux --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm desktop:test
      - run: pnpm desktop:prepare
      - run: pnpm exec electron-builder ${{ matrix.flags }} --publish never
      - name: Native packaged startup check
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.cjs
      - name: Install Linux secure storage and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 xvfb
      - name: Native Linux packaged startup check
        if: runner.os == 'Linux'
        run: dbus-run-session -- bash -c 'echo smoke-only | gnome-keyring-daemon --unlock --components=secrets; xvfb-run -a node scripts/smoke-desktop.cjs'
      - uses: actions/upload-artifact@v4
        with:
          name: comment-shield-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop-dist/*.dmg
            desktop-dist/*.zip
            desktop-dist/*.exe
            desktop-dist/*.AppImage
            desktop-dist/*.deb
